# Konfiguracja Helm dla Grafana Loki (tryb SingleBinary z lokalnym systemem plików na PVC)
# Przeznaczona do lokalnego klastra wielowęzłowego k3d (bez zewnętrznego object storage S3/MinIO).

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  useTestSchema: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 768Mi

# Wyłączamy gateway i komponenty trybu rozproszonego/cache dla lekkiego wdrożenia lokalnego
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

monitoring:
  serviceMonitor:
    enabled: true
