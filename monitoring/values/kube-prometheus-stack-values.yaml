# Konfiguracja Helm dla kube-prometheus-stack w lokalnym klastrze k3d (1 server + 2 agents)
# Alerty widoczne wyłącznie w panelach Prometheus / Alertmanager / Grafana (bez zewnętrznych powiadomień).

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
  disabled:
    # Wyłączamy stały alert testowy Watchdog oraz InfoInhibitor, aby panel alertów nie był stale czerwony
    Watchdog: true
    InfoInhibitor: true
    # Na lokalnym klastrze k3d/WSL2 drobne throttlingi komponentów systemowych nie powinny zaśmiecać dema
    CPUThrottlingHigh: true

# W k3s/k3d komponenty control plane (controller-manager, scheduler, kube-proxy, etcd)
# działają w jednym procesie k3s i domyślnie nasłuchują na 127.0.0.1 – wyłączamy ich scrapery,
# aby uniknąć fałszywych targetów DOWN.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

kubeApiServer:
  enabled: true
kubelet:
  enabled: true
coreDns:
  enabled: true
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true

prometheus-node-exporter:
  prometheus:
    monitor:
      enabled: true
      interval: 15s

kube-state-metrics:
  prometheus:
    monitor:
      enabled: true
      http:
        honorLabels: true
      metrics:
        honorLabels: true

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      receiver: 'null'
    receivers:
      - name: 'null'
    templates:
      - '/etc/alertmanager/config/*.tmpl'
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

prometheus:
  enabled: true
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    # Wykrywaj wszystkie ServiceMonitor / PodMonitor / PrometheusRule we wszystkich namespace'ach
    # niezależnie od etykiet release Helm.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        memory: 1536Mi

grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: browser
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
        allowUiUpdates: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      name: Prometheus
      uid: prometheus
      httpMethod: POST
      alertmanager:
        enabled: true
        name: Alertmanager
        uid: alertmanager
        handleGrafanaManagedAlerts: false
        implementation: prometheus
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      editable: true
      jsonData:
        maxLines: 1000
